name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Smoke test
        run: |
          ./build/nat_check --version
          ./build/nat_check --help

  build-static:
    name: Static (musl) build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static binary in Alpine
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -c '
            apk add --no-cache build-base cmake make &&
            cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release -DNATCHECK_STATIC=ON &&
            cmake --build build-static -j'

      - name: Verify it is statically linked
        run: |
          file build-static/nat_check
          file build-static/nat_check | grep -q "statically linked"
